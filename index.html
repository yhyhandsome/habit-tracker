<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="颜浩宇的习惯打卡：初级会计、英语六级、小提琴练习">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="颜浩宇打卡">
<meta name="format-detection" content="telephone=no">
<title>颜浩宇 · 习惯打卡</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- 云端状态提示条 -->
<div class="cloud-banner hidden" id="cloudBanner">
  <span id="cloudBannerText">未连接云端，数据仅保存在此设备</span>
</div>

<main class="page">
  <header class="topbar">
    <div class="topbar-text">
      <h1 class="greeting" id="greeting">颜浩宇</h1>
      <p class="subdate" id="subdate">8月25日 · 星期一</p>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="settingsBtn" aria-label="设置" title="设置">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <button class="lock-btn" id="lockBtn" title="锁定 / 编辑">
        <span id="lockIcon"></span>
        <span id="lockLabel">锁定</span>
      </button>
    </div>
  </header>

  <section class="card today-card">
    <div class="card-head">
      <h2>今日打卡</h2>
      <span class="progress-pill" id="todayProgress">0 / 3</span>
    </div>
    <ul class="habit-list" id="habitList"></ul>
  </section>

  <section class="card stats-card">
    <div class="card-head">
      <h2 id="statsTitle">统计</h2>
    </div>
    <div class="streak-row">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">连续打卡天数</div>
    </div>
    <div class="habit-stats" id="habitStats"></div>
  </section>

  <section class="card calendar-card">
    <div class="cal-head">
      <button class="cal-nav" id="prevMonth" aria-label="上个月">‹</button>
      <h2 class="cal-title" id="calTitle">2026年8月</h2>
      <button class="cal-nav" id="nextMonth" aria-label="下个月">›</button>
    </div>
    <div class="cal-weekdays" id="calWeekdays"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="day-detail hidden" id="dayDetail"></div>
  </section>

  <footer class="foot">每天进步一点点 · 颜浩宇</footer>
</main>
<!-- 密码弹窗 -->
<div class="overlay hidden" id="pinOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="输入密码">
    <h3 class="sheet-title">输入密码</h3>
    <p class="sheet-sub">解锁后才能打勾</p>
    <input class="pin-input" id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <p class="pin-err hidden" id="pinErr">密码不正确</p>
    <div class="sheet-actions">
      <button class="btn ghost" id="pinCancel">取消</button>
      <button class="btn primary" id="pinOk">确定</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="设置">
    <div class="sheet-head">
      <h3 class="sheet-title">设置</h3>
      <button class="close-x" id="settingsClose" aria-label="关闭">✕</button>
    </div>
    <div class="setting-row">
      <span class="setting-label">云端状态</span>
      <span class="setting-value" id="cloudStatus">—</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">修改密码</span>
      <button class="btn small" id="changePinBtn">修改</button>
    </div>
    <div class="change-pin-form hidden" id="changePinForm">
      <input class="pin-input" id="curPinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="当前密码">
      <input class="pin-input" id="newPinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="新密码（4–6位数字）">
      <button class="btn primary full" id="savePinBtn">保存新密码</button>
      <p class="pin-err hidden" id="pinSaveErr">—</p>
      <p class="saved-hint hidden" id="savedHint">✓ 密码已更新</p>
    </div>
    <p class="sheet-tip">页面默认只读，输入密码后才能打勾。<br>密码用于防止误改，不是高强度安全措施。</p>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
